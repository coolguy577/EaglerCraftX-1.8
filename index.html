<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>EaglercraftX 1.8</title>
<link rel="icon" href="./icon.jpeg">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #111; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #111; }
  #fullscreen {
    position: fixed; z-index: 10; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    padding: 10px 14px; border: 1px solid #ffffff50; border-radius: 8px;
    background: #111c; color: #fff; font: 600 14px system-ui, sans-serif; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  #fullscreen:hover { background: #333e; }
  #status {
    position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%,-50%);
    max-width: 90vw; padding: 14px 18px; border-radius: 10px; color: #eee;
    background: #151515e8; font: 14px/1.5 system-ui, sans-serif; text-align: center;
  }
  #status.hidden { display: none; }
  a { color: #9ed0ff; }
</style>
</head>
<body>
<div id="status">Loading EaglercraftX 1.8…<br><small>If the game does not appear, <a href="./1.8/main1.8.8.html">open the client directly</a>.</small></div>
<iframe id="game" title="EaglercraftX 1.8 game" src="./1.8/main1.8.8.html"
  allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write; pointer-lock"
  allowfullscreen></iframe>
<button id="fullscreen" type="button" aria-label="Enter full screen">⛶ Fullscreen</button>
<script>
  const game = document.getElementById('game');
  const status = document.getElementById('status');
  game.addEventListener('load', () => status.classList.add('hidden'));
  document.getElementById('fullscreen').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await game.requestFullscreen();
      else await document.exitFullscreen();
    } catch (error) {
      status.classList.remove('hidden');
      status.innerHTML = 'Fullscreen was blocked by this browser. You can still play in the full browser window.';
    }
  });
  document.addEventListener('fullscreenchange', () => {
    document.getElementById('fullscreen').textContent = document.fullscreenElement ? '⤢ Exit fullscreen' : '⛶ Fullscreen';
  });
</script>
</body>
</html>
